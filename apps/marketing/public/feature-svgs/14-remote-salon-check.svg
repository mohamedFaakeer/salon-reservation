<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="14-remote-salon-check-title 14-remote-salon-check-desc" preserveAspectRatio="xMidYMid meet">
  <title id="14-remote-salon-check-title">Check on your salon without being there</title><desc id="14-remote-salon-check-desc">A live salon dashboard is monitored remotely from a phone.</desc>
  <style>
  .line{fill:none;stroke:#0D9488;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .thin{fill:none;stroke:#5EEAD4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .dark{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .soft{fill:#CCFBF1}.soft2{fill:#F0FDFA}.teal{fill:#0D9488}.mint{fill:#5EEAD4}
  .blue{fill:#3B82F6}.amber{fill:#F59E0B}.slate{fill:#64748B}.white{fill:#fff}
  .float{animation:float 4s ease-in-out infinite}.float2{animation:float 4s ease-in-out -2s infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
  .draw{stroke-dasharray:240;animation:draw 6s ease-in-out infinite}
  .slide{animation:slide 5s ease-in-out infinite}.slide2{animation:slide2 5s ease-in-out infinite}
  .blink{animation:blink 3s ease-in-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
  @keyframes draw{0%,15%{stroke-dashoffset:240}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
  @keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
  @keyframes slide2{0%,100%{transform:translateX(0)}50%{transform:translateX(-18px)}}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
  <circle class="soft2" cx="74" cy="44" r="7"/><circle class="soft2" cx="526" cy="157" r="10"/>
  <g class="float2"><rect class="white dark" x="139" y="37" width="250" height="127" rx="17"/><path class="soft" d="M154 52h220v92H154z"/><rect class="teal" x="172" y="108" width="24" height="24" rx="5"/><rect class="mint" x="205" y="91" width="24" height="41" rx="5"/><rect class="teal" x="238" y="72" width="24" height="60" rx="5"/><path class="line draw" d="M281 119c18-6 29-32 44-24 12 6 17-17 31-22"/></g>
      <path class="dark" d="M113 174h300"/><g class="float"><rect class="white dark" x="402" y="55" width="63" height="116" rx="16"/><path class="soft" d="M413 75h41v65h-41z"/><path class="line" d="M419 109c10-14 20-14 30 0-10 14-20 14-30 0z"/><circle class="teal pulse" cx="434" cy="109" r="6"/><circle class="teal" cx="434" cy="151" r="5"/></g><path class="thin blink" d="M479 78c11 6 17 15 17 28M487 67c17 9 27 23 27 39"/>
</svg>